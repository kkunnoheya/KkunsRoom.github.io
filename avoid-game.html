<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>避けゲー | Kくんの部屋</title><style>
:root{color-scheme:dark;--pink:#ff375f;--orange:#ff9f0a;--line:rgba(255,255,255,.15)}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#080910;color:#f7f7fa;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;display:grid;place-items:center;padding:16px;background-image:radial-gradient(circle at 20% 10%,#342077,transparent 35rem)}.app{width:min(94vw,600px)}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.brand{color:#fff;text-decoration:none;font-size:13px}.stats{display:flex;gap:8px}.stat{min-width:86px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.06);text-align:right}.stat small{display:block;color:#aaa;font-size:10px}.stat b{font-size:21px}.actions{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.actions a{color:#bbb;font-size:12px;text-decoration:none}.actions button,.overlay button{border:0;border-radius:10px;padding:9px 12px;background:linear-gradient(135deg,var(--orange),var(--pink));color:#fff;font:inherit;font-size:13px;font-weight:750;cursor:pointer}#game{position:relative;height:min(64dvh,600px);min-height:340px;overflow:hidden;border:2px solid rgba(255,255,255,.28);border-radius:18px;background-color:#10131e;background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);background-size:30px 30px;touch-action:none}.player{position:absolute;bottom:18px;width:64px;height:25px;border-radius:7px;background:#81ff93;box-shadow:0 0 20px #81ff93}.enemy{position:absolute;width:38px;height:38px;border-radius:50%;background:var(--pink);box-shadow:0 0 17px var(--pink)}.overlay{position:absolute;inset:0;display:none;place-items:center;background:rgba(5,5,12,.79);text-align:center}.overlay.show{display:grid}.overlay h2{margin:0 0 9px;font-size:42px}.overlay p{color:#c7c7ce;font-size:14px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.controls button{min-height:56px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.09);color:#fff;font-size:28px}.hint{margin:10px 0 0;color:#aaa;text-align:center;font-size:12px}@media(min-width:760px){.controls{display:none}}
</style></head><body><main class="app"><header><a class="brand" href="index.html">← Kくんの部屋へ戻る</a><div class="stats"><div class="stat"><small>SCORE</small><b id="score">0</b></div><div class="stat"><small>BEST</small><b id="best">0</b></div></div></header><div class="actions"><span>避けゲー：赤い敵から逃げろ！</span><button id="full">フルスクリーン</button></div><div id="game"><div class="player" id="player"></div><div class="overlay" id="over"><div><h2>GAME OVER</h2><p>ベストスコアを更新できるｶﾅ？</p><button id="restart">もう一回！！</button></div></div></div><div class="controls"><button data-dir="-1">←</button><button data-dir="1">→</button></div><p class="hint">PC：← →キー　／　スマホ：画面をなぞって操作</p></main><script>
const g=document.querySelector('#game'),p=document.querySelector('#player'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),over=document.querySelector('#over');let x=0,enemies=[],score=0,last=0,spawn=0,dead=false,keys={};let best=+localStorage.getItem('kkunAvoidBest')||0;bestEl.textContent=best;function size(){return g.getBoundingClientRect()}function reset(){enemies.forEach(e=>e.el.remove());enemies=[];score=0;spawn=0;dead=false;over.classList.remove('show');x=(size().width-p.offsetWidth)/2;p.style.left=x+'px';scoreEl.textContent=0;last=0;requestAnimationFrame(loop)}function move(v){x=Math.max(0,Math.min(size().width-p.offsetWidth,x+v));p.style.left=x+'px'}function add(){let el=document.createElement('i'),s=30+Math.random()*15;el.className='enemy';el.style.width=el.style.height=s+'px';let e={el,x:Math.random()*(size().width-s),y:-s,s};el.style.left=e.x+'px';g.append(el);enemies.push(e)}function hit(a,b){return a.left<b.right&&a.right>b.left&&a.top<b.bottom&&a.bottom>b.top}function end(){dead=true;over.classList.add('show');if(score>best){best=score;localStorage.setItem('kkunAvoidBest',best);bestEl.textContent=best}}function loop(t){if(dead)return;if(!last)last=t;let d=Math.min(.04,(t-last)/1000);last=t;move(((keys.ArrowLeft?-1:0)+(keys.ArrowRight?1:0))*360*d);spawn+=d;if(spawn>.72){add();spawn=0}let pr=p.getBoundingClientRect();enemies.forEach(e=>{e.y+=(155+score*5)*d;e.el.style.top=e.y+'px';if(hit(pr,e.el.getBoundingClientRect()))end()});enemies=enemies.filter(e=>{if(e.y>size().height){e.el.remove();score++;scoreEl.textContent=score;return false}return true});requestAnimationFrame(loop)}document.addEventListener('keydown',e=>keys[e.key]=true);document.addEventListener('keyup',e=>keys[e.key]=false);g.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType!=='mouse'){x=e.clientX-size().left-p.offsetWidth/2;move(0)}});document.querySelectorAll('[data-dir]').forEach(b=>{let f=()=>move(+b.dataset.dir*30);b.onpointerdown=()=>{b.timer=setInterval(f,35);f()};['pointerup','pointerleave','pointercancel'].forEach(k=>b.addEventListener(k,()=>clearInterval(b.timer)))});document.querySelector('#restart').onclick=reset;document.querySelector('#full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();reset();
</script></body></html>

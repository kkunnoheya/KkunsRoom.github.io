<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>シューティング | Kくんの部屋</title><style>:root{color-scheme:dark;--pink:#ff375f;--blue:#5ac8fa;--line:rgba(255,255,255,.16)}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#060814;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:16px}.app{width:min(94vw,800px)}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}a{color:#aaa;text-decoration:none;font-size:12px}.stat{display:flex;gap:8px}.stat b{padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:#151a2b;font-size:14px}canvas{width:100%;height:auto;display:block;border:2px solid #394b76;border-radius:16px;background:#050816;box-shadow:0 18px 48px #000;touch-action:none}.row{display:flex;justify-content:space-between;align-items:center;margin:10px 0}.row button{border:0;border-radius:9px;padding:9px 13px;background:linear-gradient(135deg,#5ac8fa,#587fff);color:#fff;font:inherit;font-weight:700}.hint{margin:0;color:#aaa;text-align:center;font-size:12px}</style></head><body><main class="app"><header><a href="index.html">← Kくんの部屋へ戻る</a><div class="stat"><b>SCORE <span id="score">0</span></b><b>LIFE <span id="life">3</span></b></div></header><div class="row"><span>シューティング：敵を3発で倒せ！</span><button id="restart">リスタート</button></div><canvas id="game" width="760" height="520"></canvas><p class="hint">矢印/WASDで移動　スペースまたは長押しでショット　マウス・タッチでも操作OK</p></main><script>
const c=document.querySelector('#game'),ctx=c.getContext('2d'),S=document.querySelector('#score'),L=document.querySelector('#life');let pl,bullets,enemies,score,life,last,spawn,down,over,raf,keys={};function reset(){pl={x:380,y:465,cd:0};bullets=[];enemies=[];score=0;life=3;last=spawn=0;down=over=false;S.textContent=0;L.textContent=3;cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}function enemy(){let s=32+Math.random()*18;enemies.push({x:30+Math.random()*(700),y:-s,s,hp:3,v:95+Math.random()*75,dx:-35+Math.random()*70})}function shoot(){if(pl.cd>0||over)return;bullets.push({x:pl.x,y:pl.y-28});pl.cd=.11}function circ(e,r){let x=Math.max(r.x,Math.min(e.x,r.x+r.w)),y=Math.max(r.y,Math.min(e.y,r.y+r.h));return(e.x-x)**2+(e.y-y)**2<(e.s/2)**2}function loop(t){let d=Math.min(.033,(t-last)/1000||0);last=t;if(!over){let dx=(keys.ArrowLeft||keys.a?-1:0)+(keys.ArrowRight||keys.d?1:0),dy=(keys.ArrowUp||keys.w?-1:0)+(keys.ArrowDown||keys.s?1:0);pl.x=Math.max(22,Math.min(738,pl.x+dx*360*d));pl.y=Math.max(24,Math.min(492,pl.y+dy*360*d));if(keys[' ']||down)shoot();pl.cd=Math.max(0,pl.cd-d);spawn+=d;if(spawn>.75){enemy();spawn=0}bullets.forEach(b=>b.y-=560*d);enemies.forEach(e=>{e.y+=e.v*d;e.x+=e.dx*d;if(e.x<e.s/2||e.x>c.width-e.s/2)e.dx*=-1});bullets.forEach(b=>enemies.forEach(e=>{if(!b.dead&&!e.dead&&circ(e,{x:b.x-3,y:b.y,w:6,h:18})){b.dead=true;if(!--e.hp){e.dead=true;score+=10;S.textContent=score}}}));enemies.forEach(e=>{if(!e.dead&&(circ(e,{x:pl.x-21,y:pl.y-17,w:42,h:34})||e.y>c.height+e.s)){e.dead=true;life--;L.textContent=life;if(life<=0)over=true}});bullets=bullets.filter(b=>!b.dead&&b.y>0);enemies=enemies.filter(e=>!e.dead)}draw();raf=requestAnimationFrame(loop)}function draw(){ctx.fillStyle='#050816';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='rgba(255,255,255,.25)';for(let i=0;i<70;i++)ctx.fillRect((i*97)%c.width,(i*53+score*2)%c.height,2,2);ctx.fillStyle='#fff';bullets.forEach(b=>ctx.fillRect(b.x-3,b.y,6,18));enemies.forEach(e=>{ctx.fillStyle=e.hp===3?'#fb7185':e.hp===2?'#f97316':'#facc15';ctx.beginPath();ctx.arc(e.x,e.y,e.s/2,0,7);ctx.fill();ctx.fillStyle='#101526';ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.fillText(e.hp,e.x,e.y+5)});ctx.save();ctx.translate(pl.x,pl.y);ctx.fillStyle='#5ac8fa';ctx.beginPath();ctx.moveTo(0,-24);ctx.lineTo(24,20);ctx.lineTo(0,10);ctx.lineTo(-24,20);ctx.fill();ctx.fillStyle='#ffd166';ctx.fillRect(-5,12,10,18);ctx.restore();if(over){ctx.fillStyle='rgba(0,0,0,.74)';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#fff';ctx.font='bold 46px sans-serif';ctx.textAlign='center';ctx.fillText('GAME OVER',380,235);ctx.font='20px sans-serif';ctx.fillText('リスタートで再挑戦！',380,275)}ctx.textAlign='left'}document.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' ')e.preventDefault()});document.addEventListener('keyup',e=>keys[e.key]=false);function point(e){let r=c.getBoundingClientRect(),q=e.touches?e.touches[0]:e;pl.x=(q.clientX-r.left)*c.width/r.width;pl.y=(q.clientY-r.top)*c.height/r.height}c.onpointermove=point;c.onpointerdown=e=>{down=true;point(e);shoot()};document.onpointerup=()=>down=false;document.querySelector('#restart').onclick=reset;reset();
</script></body></html>

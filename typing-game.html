<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>K's Typing | Kくんの部屋</title><style>:root{color-scheme:dark;--cyan:#4de6ff;--pink:#ff4fd8;--green:#61ff9b;--muted:#a8b5c7}*{box-sizing:border-box}body{margin:0;min-height:100dvh;color:#f5fbff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:radial-gradient(circle at top left,#123c59,transparent 45rem),radial-gradient(circle at bottom right,#4d174b,transparent 38rem),#070914}.app{min-height:100dvh;display:grid;place-items:center;padding:18px}.panel{width:min(100%,650px);padding:clamp(25px,6vw,52px);border:1px solid rgba(77,230,255,.4);border-radius:18px;background:rgba(9,13,29,.88);box-shadow:0 0 30px #13789555;text-align:center}.back{position:fixed;top:18px;left:18px;color:var(--muted);font-size:12px;text-decoration:none}.eyebrow{color:var(--cyan);font-size:12px;font-weight:800}h1{margin:9px 0 16px;font-size:clamp(45px,11vw,78px);line-height:.92;text-shadow:0 0 18px var(--cyan),0 0 32px var(--pink)}p{color:var(--muted);line-height:1.6}select,input,button{font:inherit}select,input{width:100%;padding:13px;border:1px solid #4de6ff77;border-radius:10px;color:#fff;background:#060a18}button{border:0;border-radius:10px;padding:13px 22px;color:#07101a;background:linear-gradient(90deg,var(--cyan),var(--pink));font-weight:900;cursor:pointer}.start{margin-top:17px}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:15px}.stats div{padding:10px 4px;border:1px solid #4de6ff55;border-radius:9px;background:#050817}.stats small{display:block;color:var(--cyan);font-size:10px}.stats b{font-size:28px}.word{margin:16px 0;padding:28px 12px;border:1px solid #ff4fd866;border-radius:12px;color:var(--green);font-size:clamp(35px,9vw,64px);font-weight:900;overflow-wrap:anywhere;text-shadow:0 0 20px var(--green)}.feedback{min-height:25px;color:#ffd166}.result{font-size:70px;color:var(--green);font-weight:900;text-shadow:0 0 25px var(--green)}@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.panel{padding:25px 18px}}</style></head><body><a class="back" href="index.html">← Kくんの部屋へ戻る</a><main class="app"><section class="panel" id="title"><span class="eyebrow">NEON TYPING CHALLENGE</span><h1>K's Typing</h1><p>60秒でどれだけ正確に打てるか挑戦しよう。</p><select id="difficulty"><option value="easy">Easy / やさしい</option><option value="normal" selected>Normal / ふつう</option><option value="hard">Hard / むずかしい</option></select><button class="start" id="start">START</button></section><section class="panel hidden" id="play"><div class="stats"><div><small>TIME</small><b id="time">60</b></div><div><small>SCORE</small><b id="score">0</b></div><div><small>COMBO</small><b id="combo">0</b></div><div><small>MISS</small><b id="miss">0</b></div></div><p class="eyebrow">TYPE THIS</p><div class="word" id="word"></div><input id="input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="表示された文字を入力"><p class="feedback" id="feedback"></p></section><section class="panel hidden" id="result"><span class="eyebrow">RESULT</span><h1>GAME OVER</h1><p>FINAL SCORE</p><div class="result" id="final">0</div><button id="again">PLAY AGAIN</button></section></main><script>
const lists={easy:['cat','dog','sun','moon','neon','ねこ','いぬ','そら','ほし','ゆめ'],normal:['browser','coding','digital','keyboard','rocket','たいぴんぐ','さくら','みらい','ひかり','でんし'],hard:['quantum','javascript','cybercity','hyperdrive','neonmatrix','高速タイピング','未来都市','電脳世界','集中力','正確入力']};let words,time,score,combo,miss,current,timer,composing=false;const $=s=>document.querySelector(s);function show(id){['title','play','result'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==id))}function next(){current=words[Math.floor(Math.random()*words.length)].toLowerCase();$('#word').textContent=current;$('#input').value=''}function stat(){['time','score','combo','miss'].forEach(k=>$('#'+k).textContent=({time,score,combo,miss})[k])}function start(){words=lists[$('#difficulty').value];time=60;score=combo=miss=0;stat();next();show('play');$('#input').focus();clearInterval(timer);timer=setInterval(()=>{if(!--time){clearInterval(timer);$('#final').textContent=score;show('result')}stat()},1000)}$('#start').onclick=start;$('#again').onclick=start;$('#input').addEventListener('compositionstart',()=>composing=true);$('#input').addEventListener('compositionend',()=>{composing=false;check()});$('#input').addEventListener('input',check);function check(){if(composing)return;let v=$('#input').value.trim().toLowerCase();if(v&&!current.startsWith(v)){miss++;combo=0;$('#feedback').textContent='Miss! まちがえた文字を消しました';$('#input').value=v.slice(0,-1);stat();return}if(v===current){score+=10;combo++;$('#feedback').textContent=combo>=10?'Neon Boost!!':'Nice!';stat();next()}}
</script></body></html>
